name: Linux (Flatpak)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Keep the deps module's file list in sync with AnkerStudio/deps.
      - name: Regenerate deps sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 AnkerStudio/pack/flatpak/gen-deps-sources.py

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          arch: ${{ matrix.arch }}
          bundle: M5FDMStudio-${{ matrix.arch }}.flatpak
          manifest-path: AnkerStudio/pack/flatpak/io.github.artur9010.M5FDMStudio.yml
          # The deps superbuild (Boost, wxWidgets, OCCT, ...) dominates build time. The key
          # only changes with the manifest or deps/, so the cache is saved once per deps
          # change; on a miss the action falls back to the newest "flatpak-builder-<arch>*"
          # cache, and flatpak-builder itself rebuilds only modules whose sources changed.
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('AnkerStudio/pack/flatpak/*.yml', 'AnkerStudio/deps/**') }}
          upload-artifact: true

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: M5FDMStudio-${{ matrix.arch }}.flatpak
