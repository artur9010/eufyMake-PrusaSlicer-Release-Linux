name: macOS (DMG)

on:
  push:
    branches: [main, ci/macos-dmg]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Oldest macOS the app (and the static deps) are built for; matches LSMinimumSystemVersion
  # in make_app.sh. Part of the deps cache key.
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  # Brew libraries the app links (openssl@3, jansson, xz, zstd) plus the bundling tool.
  BREW_PACKAGES: gettext openssl@3 xz zstd jansson dylibbundler

jobs:
  # The deps superbuild (Boost, wxWidgets, OCCT, CGAL, OpenVDB, ...) takes hours, so it is
  # its own job: it gets a full 6 h timeout of its own, and its cache is saved even if the
  # app build fails later. On a cache hit this job finishes in seconds.
  deps:
    name: Build deps (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          # Native Intel runner (macos-13 is retired; macos-15-intel is GitHub's last x86_64
          # macOS image).
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Compute cache key
        id: key
        run: echo "key=macos-deps-${{ matrix.arch }}-${{ matrix.runner }}-${MACOSX_DEPLOYMENT_TARGET}-${{ hashFiles('AnkerStudio/deps/**') }}" >> "$GITHUB_OUTPUT"

      - name: Look up deps cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: AnkerStudio/deps/deps_build/destdir
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Install Homebrew packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install $BREW_PACKAGES

      - name: Build deps
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: AnkerStudio/deps
        run: |
          uname -m
          cmake -S . -B deps_build \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          # -j1 is only the top level; every dep builds in parallel itself.
          cmake --build deps_build -j1

      - name: Save deps cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          # Only the install tree; the build/download trees are many GB. wx-config hardcodes
          # this absolute path, which is the same on every run of a given runner label.
          path: AnkerStudio/deps/deps_build/destdir
          key: ${{ steps.key.outputs.key }}

  app:
    name: Build DMG (${{ matrix.arch }})
    needs: deps
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      DMG_NAME: M5FDMStudio-macos-${{ matrix.arch }}.dmg
    steps:
      - uses: actions/checkout@v4

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: AnkerStudio/deps/deps_build/destdir
          key: macos-deps-${{ matrix.arch }}-${{ matrix.runner }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('AnkerStudio/deps/**') }}
          fail-on-cache-miss: true

      - name: Install Homebrew packages
        run: brew install $BREW_PACKAGES

      - name: Generate Xcode project
        working-directory: AnkerStudio
        run: |
          ARCH=${{ matrix.arch }} MACOS_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
              ./gen_xcode_proj.sh -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build app
        working-directory: AnkerStudio
        run: |
          xcodebuild -project build_xcode/eufyStudio.xcodeproj -target eufyStudio \
              -configuration Release -jobs "$(sysctl -n hw.ncpu)" -quiet

      - name: Bundle and package DMG (ad-hoc signed)
        working-directory: AnkerStudio
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          DO_BUILD=0 CONFIG=Release DO_NOTARIZE=0 DEV_ID="-" ./make_app.sh

      - name: Verify bundle
        working-directory: AnkerStudio/dist
        run: |
          app="M5 FDM Studio.app"
          lipo -info "$app/Contents/MacOS/eufyStudio"
          lipo -info "$app/Contents/Frameworks/libAnkerNet.dylib"
          [ "$(lipo -archs "$app/Contents/MacOS/eufyStudio")" = "${{ matrix.arch }}" ] \
              || { echo "::error::main binary is not ${{ matrix.arch }}"; exit 1; }
          bad=0
          while IFS= read -r -d '' f; do
              file -b "$f" | grep -q Mach-O || continue
              echo "== ${f#$app/}"
              otool -L "$f" | tail -n +2
              if otool -L "$f" | tail -n +2 | grep -E '/opt/homebrew|/usr/local|/Users/'; then
                  echo "::error::$f references a non-bundled library"; bad=1
              fi
          done < <(find "$app/Contents/MacOS" "$app/Contents/Frameworks" -type f -print0)
          codesign --verify --deep --strict --verbose=2 "$app"
          ls -lh "$DMG_NAME"
          exit $bad

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: AnkerStudio/dist/${{ env.DMG_NAME }}
          if-no-files-found: error
          compression-level: 0

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AnkerStudio/dist/${{ env.DMG_NAME }}
