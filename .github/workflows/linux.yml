name: Linux (Flatpak)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Keep the deps module's file list in sync with AnkerStudio/deps.
      - name: Regenerate deps sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 AnkerStudio/pack/flatpak/gen-deps-sources.py

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: M5FDMStudio.flatpak
          manifest-path: AnkerStudio/pack/flatpak/io.github.artur9010.M5FDMStudio.yml
          # The deps superbuild (Boost, wxWidgets, OCCT, ...) dominates build time. The key
          # only changes with the manifest or deps/, so the cache is saved once per deps
          # change; on a miss the action falls back to the newest "flatpak-builder-x86_64*"
          # cache, and flatpak-builder itself rebuilds only modules whose sources changed.
          cache-key: flatpak-builder-x86_64-${{ hashFiles('AnkerStudio/pack/flatpak/*.yml', 'AnkerStudio/deps/**') }}
          upload-artifact: true

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: M5FDMStudio.flatpak
